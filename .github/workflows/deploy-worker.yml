name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DEPLOY_BASE: /
          SITE_URL: https://tokinonagi.dpdns.org/

      - name: Deploy Worker
        shell: bash
        run: |
          set +e
          pnpm exec wrangler deploy --tag "$GITHUB_SHA" 2>&1 | tee /tmp/wrangler-deploy.log
          deploy_status=${PIPESTATUS[0]}
          if (( deploy_status != 0 )); then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Cloudflare deployment failed::$line"
            done < <(tail -n 16 /tmp/wrangler-deploy.log)
          fi
          exit "$deploy_status"
