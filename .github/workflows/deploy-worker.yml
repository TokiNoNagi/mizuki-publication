name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DEPLOY_BASE: /
          SITE_URL: https://tokinonagi.dpdns.org/

      - name: Verify Cloudflare zone access
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --get "https://api.cloudflare.com/client/v4/zones" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-urlencode "name=tokinonagi.dpdns.org") || {
              echo "::error title=Cloudflare zone preflight::Cloudflare API request failed"
              exit 1
            }
          if [[ $(jq -r '.success' <<< "$response") != true ]]; then
            jq -r '.errors[] | "::error title=Cloudflare zone preflight::API error \(.code): \(.message)"' <<< "$response"
            exit 1
          fi
          if [[ $(jq -r '.result | length' <<< "$response") != 1 ]]; then
            echo "::error title=Cloudflare zone preflight::The API token cannot access the active tokinonagi.dpdns.org zone; check Zone Read and token resource scope"
            exit 1
          fi
          if [[ $(jq -r '.result[0].account.id' <<< "$response") != "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Cloudflare zone preflight::CLOUDFLARE_ACCOUNT_ID does not match the account that owns the tokinonagi.dpdns.org zone"
            exit 1
          fi
          if [[ $(jq -r '.result[0].status' <<< "$response") != active ]]; then
            echo "::error title=Cloudflare zone preflight::The tokinonagi.dpdns.org zone is not active"
            exit 1
          fi

      - name: Deploy Worker
        shell: bash
        run: |
          set +e
          pnpm exec wrangler deploy --tag "$GITHUB_SHA" 2>&1 | tee /tmp/wrangler-deploy.log
          deploy_status=${PIPESTATUS[0]}
          if (( deploy_status != 0 )); then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Cloudflare deployment failed::$line"
            done < <(grep -i -B 6 -A 12 -E 'error|failed|permission|zone|route|domain|cname|code:' /tmp/wrangler-deploy.log | tail -n 40)
          fi
          exit "$deploy_status"
